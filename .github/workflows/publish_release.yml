name: Build and publish monarch wheels

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        required: true
        default: Nightly
        options:
          - Nightly
          - Official prerelease
          - Official release
      version:
        description: "Version string (e.g. 0.7.0rc1 or 0.7.0); leave empty for a nightly"
        type: string
        required: false
        default: ''
  # For testing changes to this workflow.
  pull_request:
    branches:
      - main
      - gh/**
    paths:
      - .github/workflows/publish_release.yml
      - .github/workflows/build-dist.yml
      - .github/workflows/build-macos.yml
      - scripts/prepare_release.py
      - scripts/test_prepare_release.py
      - Dockerfile
      - Dockerfile.nightly
  push:
    branches:
      - main
    # Run as soon as any changes to .github actions land
    paths:
      - .github/**
      - scripts/prepare_release.py
      - scripts/test_prepare_release.py
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare-release:
    name: Validate release selection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_type: ${{ steps.release.outputs.release_type }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install version parser
        run: python -m pip install packaging

      - name: Test release validation
        run: python -m unittest discover -s scripts -p test_prepare_release.py

      - name: Validate release inputs
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'Nightly' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare_release.py

  build-x86_64:
    needs: prepare-release
    uses: ./.github/workflows/build-dist.yml
    with:
      # TODO add 3.14 once we figure out py03 issue
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      # Published wheels ship cu132 even though PR CI tests at cu130 (see
      # set-matrix.yaml): pytorch core does the same split — publish cu132
      # binaries, GPU-test only at cu130 — because no g4dn-fleet AMI yet
      # carries an NVIDIA driver that satisfies nvidia-container-cli's
      # cuda>=13.2 check.
      #
      # Building a wheel needs the CUDA toolkit (nvcc, headers, libs) but not
      # host-GPU access. The cuda13.2 builder image supplies the toolkit; we
      # set gpu-arch-type=cpu so test-infra's linux_job_v2.yml skips the
      # `setup-nvidia` step that mounts `--gpus all` and triggers
      # nvidia-container-cli's host-driver-vs-CUDA version check. Passing an
      # already-tagged docker-image makes test-infra use it verbatim instead
      # of auto-suffixing it from gpu-arch-type/version.
      runner: linux.c7i.2xlarge
      docker-image: 'pytorch/manylinux2_28-builder:cuda13.2'
      torch-spec: ${{ needs.prepare-release.outputs.release_type != 'nightly' && 'torch==2.14.1 --extra-index-url https://download.pytorch.org/whl/cu132' || '--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu132' }}
      gpu-arch-type: cpu
      gpu-arch-version: ''
      arch-label: cuda13.2
      version: ${{ needs.prepare-release.outputs.version }}
      platform: x86_64

  build-arm64:
    needs: prepare-release
    uses: ./.github/workflows/build-dist.yml
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      runner: linux.arm64.2xlarge
      docker-image: 'pytorch/manylinuxaarch64-builder:cuda13.2'
      torch-spec: ${{ needs.prepare-release.outputs.release_type != 'nightly' && 'torch==2.14.1 --extra-index-url https://download.pytorch.org/whl/cu132' || '--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu132' }}
      gpu-arch-type: cuda
      gpu-arch-version: '13.2'
      version: ${{ needs.prepare-release.outputs.version }}
      platform: aarch64

  build-macos:
    needs: prepare-release
    uses: ./.github/workflows/build-macos.yml
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      runner: macos-latest
      torch-spec: ${{ needs.prepare-release.outputs.release_type != 'nightly' && 'torch==2.14.1 --extra-index-url https://download.pytorch.org/whl/cpu' || '--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cpu' }}
      version: ${{ needs.prepare-release.outputs.version }}

  publish-to-pypi:
    name: Publish to PyPI
    needs: [prepare-release, build-x86_64, build-arm64, build-macos]
    runs-on: ubuntu-latest
    # Keep the publishing workflow filename identical for stable and nightly
    # releases: PyPI compares it when detecting changes of provenance.
    # Register publish_release.yml with BOTH environments as PyPI trusted publishers.
    environment: ${{ needs.prepare-release.outputs.release_type != 'nightly' && 'stable' || 'nightly' }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write  # Required for PyPI trusted publishing
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "!*.dockerbuild"
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          verbose: true

  publish-to-container-registry:
    name: Publish to Github Container Registry
    needs: [prepare-release, build-x86_64, build-arm64]
    runs-on: ubuntu-latest
    environment: nightly
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.prepare-release.outputs.release_type == 'nightly' }}
    permissions:
      contents: read
      packages: write # Grant write permission for packages (GHCR)
    steps:
      # This step is required to avoid the "no space left on device" error from
      # the large pytorch docker image.
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Checkout repository
        uses: actions/checkout@v6

      # Download wheels outside the repo so they don't interfere with the
      # Docker build context (dist/ is in .dockerignore).
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Docker container only has python 3.12, so we need to use the x86_64 3.12 wheel.
          name: monarch-py3.12-cuda13.2-x86_64
          path: ${{ runner.temp }}/monarch_wheels
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get tag for publishing
        run: echo "DOCKER_TAG=0.8.0.dev$(date +'%Y%m%d')-cuda13.2" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: . # Build context is the root directory
          file: ./Dockerfile.nightly
          push: true # Push the image to the registry
          # Push to monarch-nightly package instead of monarch.
          tags: |
            ghcr.io/${{ github.repository }}-nightly:${{ env.DOCKER_TAG }}
            ghcr.io/${{ github.repository }}-nightly:latest
          # TODO: find docker tag that gets updated automatically.
          build-args: |
            PYTORCH_TAG=2.16.0.dev20261010-cuda13.2-cudnn9-runtime
          build-contexts: |
            monarch-wheels=${{ runner.temp }}/monarch_wheels

  build-and-push-stable:
    name: Build and push stable docker image
    # Only make a new docker image if the publish is successful.
    needs: [prepare-release, publish-to-pypi]
    runs-on: ubuntu-latest
    environment: stable
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-release.outputs.release_type != 'nightly' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Tags
        id: determine-tags
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TYPE: ${{ needs.prepare-release.outputs.release_type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAGS="ghcr.io/${REPOSITORY}:${VERSION}-cuda13.2"
          if [[ "$RELEASE_TYPE" == "release" ]]; then
            TAGS="$TAGS,ghcr.io/${REPOSITORY}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.determine-tags.outputs.tags }}
          build-args: |
            PYTORCH_TAG=2.14.1-cuda13.2-cudnn9-runtime
            MONARCH_VERSION=${{ needs.prepare-release.outputs.version }}

  create-docs-branch:
    name: Create docs release branch
    needs: [prepare-release, publish-to-pypi]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-release.outputs.release_type == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create docs release branch
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          git checkout -b "docs/v${VERSION}"
          git push origin "docs/v${VERSION}"
