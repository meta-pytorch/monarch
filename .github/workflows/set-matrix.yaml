name: Set Matrix

on:
  workflow_call:
    inputs:
      runner-rocm:
        description: 'Override default ROCm runner label'
        required: false
        type: string
        default: linux.rocm.gpu.gfx942.1.meta-pytorch
      runner-cuda:
        description: 'Override default CUDA runner label'
        required: false
        type: string
        # Matches what pytorch core uses for CUDA GPU smoke tests
        # (caffe2/.github/workflows/generated-linux-binary-manywheel-nightly.yml).
        # PR CI builds and tests at CUDA 13.0 because pytorch's own PR/trunk
        # GPU jobs do the same (test-h100.yml runs on cuda13.0); release
        # wheels ship cu132 from build-dist.yml on a CPU runner.
        default: linux.g4dn.4xlarge.nvidia.gpu
    outputs:
      test-matrix:
        description: Test matrix (py3.10 only)
        value: ${{ jobs.set.outputs.test-matrix }}
      build-matrix:
        description: Build matrix (includes all python versions)
        value: ${{ jobs.set.outputs.build-matrix }}

jobs:
  # Source ROCm/Python versions from pytorch/test-infra when a ciflow/rocm tag
  # run needs them, instead of hardcoding rocm7.14 / rocm10.0 here.
  generate-rocm-matrix:
    if: ${{ startsWith(github.ref, 'refs/tags/ciflow/rocm/') }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      channel: nightly
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      with-cpu: disable
      with-xpu: disable
      with-cuda: disable
      with-rocm: enable
      # Single oldest Python from test-infra's channel list (auto-bumps).
      build-python-only: "enable"

  set:
    if: >-
      always() && !cancelled() &&
      (needs.generate-rocm-matrix.result == 'success' || needs.generate-rocm-matrix.result == 'skipped')
    needs: generate-rocm-matrix
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.set.outputs.test-matrix }}
      build-matrix: ${{ steps.set.outputs.build-matrix }}
    env:
      IS_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads') }}
      IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
      IS_ROCM_TAG: ${{ startsWith(github.ref, 'refs/tags/ciflow/rocm/') }}
      HAS_ROCM_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ciflow/rocm') }}
      ROCM_BINARY_MATRIX: ${{ needs.generate-rocm-matrix.outputs.matrix }}

    steps:
      - id: set
        run: |
          set -euox pipefail

          # PR CI is pinned to CUDA 13.0 (cu130) to match pytorch core: their
          # PR/trunk GPU jobs (e.g. test-h100.yml) run cuda13.0, and the
          # g4dn fleet's host driver currently fails nvidia-container-cli's
          # check against cuda13.2 containers. Release/nightly wheels still
          # ship cu132 via publish_release.yml on a CPU runner.

          # Define CUDA test/build matrices
          CUDA='{"name": "cuda", "runner": "${{ inputs.runner-cuda }}", "gpu-arch-type": "cuda", "gpu-arch-version": "13.0", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          CUDA_PY310='{"name": "cuda", "python-version": "3.10", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          CUDA_PY312='{"name": "cuda", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'

          # Build matrix:
          # - ROCm tag: ROCm only (manual opt-in; CUDA already built in PR run)
          # - Otherwise (PR/push/schedule): CUDA only
          # ROCm is disabled in normal CI while it is broken. Push a
          # ciflow/rocm tag to build and test ROCm manually. See
          # https://github.com/meta-pytorch/monarch/issues/4145 for re-enabling.
          if [[ "$IS_ROCM_TAG" == "true" ]]; then
            if [[ -z "${ROCM_BINARY_MATRIX}" ]]; then
              echo "::error::ROCm binary matrix from test-infra is empty" >&2
              exit 1
            fi
            # One entry per unique ROCm version. build-python-only already left
            # a single Python in the matrix.
            BUILD_MATRIX=$(echo "${ROCM_BINARY_MATRIX}" | jq -c '
              [
                .include[]
                | {
                    name: ("rocm" + .gpu_arch_version),
                    "python-version": .python_version,
                    "docker-image": ("pytorch/manylinux2_28-builder:rocm" + .gpu_arch_version),
                    "torch-spec": ("--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm" + .gpu_arch_version + "/")
                  }
              ]
              | unique_by(.name)
            ')
            TEST_MATRIX=$(echo "${ROCM_BINARY_MATRIX}" | jq -c --arg runner "${{ inputs.runner-rocm }}" '
              [
                .include[]
                | {
                    name: ("rocm" + .gpu_arch_version),
                    runner: $runner,
                    "gpu-arch-type": "rocm",
                    "gpu-arch-version": .gpu_arch_version,
                    "docker-image": ("pytorch/manylinux2_28-builder:rocm" + .gpu_arch_version),
                    "torch-spec": ("--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm" + .gpu_arch_version + "/")
                  }
              ]
              | unique_by(."gpu-arch-version")
            ')
            echo "ROCm build matrix from test-infra: ${BUILD_MATRIX}"
            echo "ROCm test matrix from test-infra: ${TEST_MATRIX}"
          else
            BUILD_MATRIX="[$CUDA_PY310, $CUDA_PY312]"
            TEST_MATRIX="[$CUDA]"
          fi

          # Export matrices to job outputs
          {
            echo 'test-matrix<<EOF'
            echo "{\"include\": $TEST_MATRIX}"
            echo 'EOF'
            echo 'build-matrix<<EOF'
            echo "{\"include\": $BUILD_MATRIX}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
