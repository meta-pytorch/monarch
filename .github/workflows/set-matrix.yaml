name: Set Matrix

on:
  workflow_call:
    inputs:
      runner-rocm:
        description: 'Override default ROCm runner label'
        required: false
        type: string
        default: linux.rocm.gpu.gfx942.1.meta-pytorch
      runner-cuda:
        description: 'Override default CUDA runner label'
        required: false
        type: string
        # OSDC (ARC) T4 runner, the equivalent of linux.g4dn.4xlarge.nvidia.gpu
        # that pytorch core uses for CUDA GPU smoke tests.
        # PR CI builds and tests at CUDA 13.0 because pytorch's own PR/trunk
        # GPU jobs do the same (test-h100.yml runs on cuda13.0); release
        # wheels ship cu132 from build-dist.yml on a CPU runner.
        default: mt-l-x86iavx512-29-115-t4
    outputs:
      cuda-test-matrix:
        description: CUDA test matrix (one python version per entry), run on OSDC
        value: ${{ jobs.set.outputs.cuda-test-matrix }}
      cuda-python-test-matrix:
        description: CUDA Python test matrix (cuda-test-matrix plus free-threaded py3.14t), run on OSDC
        value: ${{ jobs.set.outputs.cuda-python-test-matrix }}
      rocm-test-matrix:
        description: ROCm test matrix (one python version per entry), empty when ROCm is not tested
        value: ${{ jobs.set.outputs.rocm-test-matrix }}
      build-matrix:
        description: Build matrix (includes all python versions)
        value: ${{ jobs.set.outputs.build-matrix }}

jobs:
  set:
    runs-on: ubuntu-latest
    outputs:
      cuda-test-matrix: ${{ steps.set.outputs.cuda-test-matrix }}
      cuda-python-test-matrix: ${{ steps.set.outputs.cuda-python-test-matrix }}
      rocm-test-matrix: ${{ steps.set.outputs.rocm-test-matrix }}
      build-matrix: ${{ steps.set.outputs.build-matrix }}
    env:
      IS_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
      IS_ROCM_TAG: ${{ startsWith(github.ref, 'refs/tags/ciflow/rocm/') }}
      HAS_ROCM_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ciflow/rocm') }}

    steps:
      - id: set
        run: |
          set -euox pipefail

          # PR CI is pinned to CUDA 13.0 (cu130) to match pytorch core: their
          # PR/trunk GPU jobs (e.g. test-h100.yml) run cuda13.0, and the
          # g4dn fleet's host driver currently fails nvidia-container-cli's
          # check against cuda13.2 containers. Release/nightly wheels still
          # ship cu132 via publish_release.yml on a CPU runner.

          # Define test matrices. python-version picks the build artifact to
          # test. ROCm uses 3.12: the rocm10.1 nightly has no cp310/cp311
          # torch for current nightlies, so an older python can silently fall
          # back to PyPI's CUDA torch via --extra-index-url.
          CUDA='{"name": "cuda", "python-version": "3.11", "runner": "${{ inputs.runner-cuda }}", "gpu-arch-type": "cuda", "gpu-arch-version": "13.0", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          ROCM_100='{"name": "rocm10.0", "python-version": "3.12", "runner": "${{ inputs.runner-rocm }}", "gpu-arch-type": "rocm", "gpu-arch-version": "10.0", "docker-image": "pytorch/manylinux2_28-builder:rocm10.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.0/"}'
          ROCM_101='{"name": "rocm10.1", "python-version": "3.12", "runner": "${{ inputs.runner-rocm }}", "gpu-arch-type": "rocm", "gpu-arch-version": "10.1", "docker-image": "pytorch/manylinux2_28-builder:rocm10.1", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.1/"}'

          # Define build matrices (includes python-version)
          CUDA_PY311='{"name": "cuda", "python-version": "3.11", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          CUDA_PY312='{"name": "cuda", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          CUDA_PY314='{"name": "cuda", "python-version": "3.14", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          CUDA_PY314T='{"name": "cuda", "python-version": "3.14t", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          ROCM_100_PY312='{"name": "rocm10.0", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:rocm10.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.0/"}'
          ROCM_101_PY312='{"name": "rocm10.1", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:rocm10.1", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.1/"}'

          # Build matrix:
          # - ROCm tag: ROCm only (manual opt-in; CUDA already built in PR run)
          # - Push to main: CUDA + ROCm
          # - Otherwise (PR/schedule): CUDA only
          # ROCm is not run on PRs. Push a ciflow/rocm tag to build and test
          # ROCm manually. See
          # https://github.com/meta-pytorch/monarch/issues/4145 for re-enabling.
          if [[ "$IS_ROCM_TAG" == "true" ]]; then
            BUILD_MATRIX="[$ROCM_100_PY312, $ROCM_101_PY312]"
          elif [[ "$IS_PUSH" == "true" ]]; then
            BUILD_MATRIX="[$CUDA_PY311, $CUDA_PY312, $CUDA_PY314, $CUDA_PY314T, $ROCM_100_PY312, $ROCM_101_PY312]"
          else
            BUILD_MATRIX="[$CUDA_PY311, $CUDA_PY312, $CUDA_PY314, $CUDA_PY314T]"
          fi

          # Test matrix: ROCm tested on a manual ciflow/rocm tag and on pushes
          # to main; CUDA otherwise. CUDA and ROCm are separate outputs because
          # CUDA runs on OSDC (linux_job_v3) and ROCm stays on its own runners
          # (linux_job_v2). An empty one skips its job.
          CUDA_TEST_MATRIX=""
          ROCM_TEST_MATRIX=""
          if [[ "$IS_ROCM_TAG" == "true" ]]; then
            ROCM_TEST_MATRIX="{\"include\": [$ROCM_100, $ROCM_101]}"
          elif [[ "$IS_PUSH" == "true" ]]; then
            CUDA_TEST_MATRIX="{\"include\": [$CUDA]}"
            ROCM_TEST_MATRIX="{\"include\": [$ROCM_100, $ROCM_101]}"
          else
            CUDA_TEST_MATRIX="{\"include\": [$CUDA]}"
          fi

          # CUDA Python test matrix: the CUDA test matrix plus a free-threaded
          # py3.14t CUDA run so GIL-free regressions surface on PRs.
          CUDA_PYTHON_TEST_MATRIX=""
          if [[ -n "$CUDA_TEST_MATRIX" ]]; then
            CUDA_PYTHON_TEST_MATRIX=$(echo "$CUDA_TEST_MATRIX" | jq -c --argjson cuda "$CUDA" '.include += [$cuda + {"python-version": "3.14t"}]')
          fi

          # Export matrices to job outputs
          {
            echo 'cuda-test-matrix<<EOF'
            echo "$CUDA_TEST_MATRIX"
            echo 'EOF'
            echo 'rocm-test-matrix<<EOF'
            echo "$ROCM_TEST_MATRIX"
            echo 'EOF'
            echo 'cuda-python-test-matrix<<EOF'
            echo "$CUDA_PYTHON_TEST_MATRIX"
            echo 'EOF'
            echo 'build-matrix<<EOF'
            echo "{\"include\": $BUILD_MATRIX}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
