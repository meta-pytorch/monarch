name: Set Matrix

on:
  workflow_call:
    inputs:
      runner-rocm:
        description: 'Override default ROCm runner label'
        required: false
        type: string
        default: linux.rocm.gpu.gfx942.1.meta-pytorch
      runner-cuda:
        description: 'Override default CUDA runner label'
        required: false
        type: string
        # Matches what pytorch core uses for CUDA GPU smoke tests
        # (caffe2/.github/workflows/generated-linux-binary-manywheel-nightly.yml).
        # PR CI builds and tests at CUDA 13.0 because pytorch's own PR/trunk
        # GPU jobs do the same (test-h100.yml runs on cuda13.0); release
        # wheels ship cu132 from build-dist.yml on a CPU runner.
        default: linux.g4dn.4xlarge.nvidia.gpu
    outputs:
      test-matrix:
        description: Test matrix (one python version per entry)
        value: ${{ jobs.set.outputs.test-matrix }}
      build-matrix:
        description: Build matrix (includes all python versions)
        value: ${{ jobs.set.outputs.build-matrix }}

jobs:
  set:
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.set.outputs.test-matrix }}
      build-matrix: ${{ steps.set.outputs.build-matrix }}
    env:
      IS_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
      IS_ROCM_TAG: ${{ startsWith(github.ref, 'refs/tags/ciflow/rocm/') }}
      HAS_ROCM_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ciflow/rocm') }}

    steps:
      - id: set
        run: |
          set -euox pipefail

          # PR CI is pinned to CUDA 13.0 (cu130) to match pytorch core: their
          # PR/trunk GPU jobs (e.g. test-h100.yml) run cuda13.0, and the
          # g4dn fleet's host driver currently fails nvidia-container-cli's
          # check against cuda13.2 containers. Release/nightly wheels still
          # ship cu132 via publish_release.yml on a CPU runner.

          # Define test matrices. python-version picks the build artifact to
          # test. ROCm uses 3.12: the rocm10.1 nightly has no cp310 torch, so
          # on 3.10 pip silently falls back to PyPI's CUDA torch.
          CUDA='{"name": "cuda", "python-version": "3.10", "runner": "${{ inputs.runner-cuda }}", "gpu-arch-type": "cuda", "gpu-arch-version": "13.0", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          ROCM_100='{"name": "rocm10.0", "python-version": "3.12", "runner": "${{ inputs.runner-rocm }}", "gpu-arch-type": "rocm", "gpu-arch-version": "10.0", "docker-image": "pytorch/manylinux2_28-builder:rocm10.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.0/"}'
          ROCM_101='{"name": "rocm10.1", "python-version": "3.12", "runner": "${{ inputs.runner-rocm }}", "gpu-arch-type": "rocm", "gpu-arch-version": "10.1", "docker-image": "pytorch/manylinux2_28-builder:rocm10.1", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.1/"}'

          # Define build matrices (includes python-version)
          CUDA_PY310='{"name": "cuda", "python-version": "3.10", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          CUDA_PY312='{"name": "cuda", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:cuda13.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cu130"}'
          ROCM_100_PY312='{"name": "rocm10.0", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:rocm10.0", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.0/"}'
          ROCM_101_PY312='{"name": "rocm10.1", "python-version": "3.12", "docker-image": "pytorch/manylinux2_28-builder:rocm10.1", "torch-spec": "--pre torch --extra-index-url https://download.pytorch.org/whl/nightly/rocm10.1/"}'

          # Build matrix:
          # - ROCm tag: ROCm only (manual opt-in; CUDA already built in PR run)
          # - Push to main: CUDA + ROCm
          # - Otherwise (PR/schedule): CUDA only
          # ROCm is not run on PRs. Push a ciflow/rocm tag to build and test
          # ROCm manually. See
          # https://github.com/meta-pytorch/monarch/issues/4145 for re-enabling.
          if [[ "$IS_ROCM_TAG" == "true" ]]; then
            BUILD_MATRIX="[$ROCM_100_PY312, $ROCM_101_PY312]"
          elif [[ "$IS_PUSH" == "true" ]]; then
            BUILD_MATRIX="[$CUDA_PY310, $CUDA_PY312, $ROCM_100_PY312, $ROCM_101_PY312]"
          else
            BUILD_MATRIX="[$CUDA_PY310, $CUDA_PY312]"
          fi

          # Test matrix: ROCm tested on a manual ciflow/rocm tag and on pushes
          # to main; CUDA otherwise.
          if [[ "$IS_ROCM_TAG" == "true" ]]; then
            TEST_MATRIX="[$ROCM_100, $ROCM_101]"
          elif [[ "$IS_PUSH" == "true" ]]; then
            TEST_MATRIX="[$CUDA, $ROCM_100, $ROCM_101]"
          else
            TEST_MATRIX="[$CUDA]"
          fi

          # Export matrices to job outputs
          {
            echo 'test-matrix<<EOF'
            echo "{\"include\": $TEST_MATRIX}"
            echo 'EOF'
            echo 'build-matrix<<EOF'
            echo "{\"include\": $BUILD_MATRIX}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
