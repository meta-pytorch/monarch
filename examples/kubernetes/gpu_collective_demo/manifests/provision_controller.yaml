# Controller manifest for Python-native MonarchMesh provisioning.
#
# Prerequisites:
# - Kubernetes cluster with Monarch operator installed
# - monarch-tests namespace created
---
apiVersion: v1
kind: Pod
metadata:
  name: monarch-client-demo
  namespace: monarch-tests
spec:
  serviceAccountName: monarch-client
  containers:
    - name: monarch
      image: ghcr.io/meta-pytorch/monarch:latest
      env:
        # Optional. This controller requests no GPUs, but some NVIDIA runtimes
        # still mount every GPU on the node; this hides them. To give the
        # controller GPUs, request nvidia.com/gpu and remove this setting.
        - name: NVIDIA_VISIBLE_DEVICES
          value: void
      command: ["sleep"]
      args: ["infinity"]
