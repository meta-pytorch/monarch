# Build system configuration - PEP 517/518
[build-system]
# Note: torch is required at build time (not just runtime) because:
#   1. build_support.py detects torch installation paths and C++11 ABI
#   2. embedded C++ modules link against libtorch
#   3. Build-time torch detection determines whether to enable tensor_engine feature
# The torch index is controlled by [tool.uv.sources] below (e.g., pytorch-cu132)
requires = ["maturin>=1.14,<2", "packaging>=24", "numpy>=1.26", "torch"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "torchmonarch"
dynamic = ["version"]  # overridden via MONARCH_VERSION env var
description = "Monarch: Single controller library"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Meta", email = "oncall+monarch@xmail.facebook.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pyzmq",
    "pyarrow>=17",
    "requests",
    "numpy>=1.26",
    "pyre-extensions",
    "typing-extensions>=4.12",
    "cloudpickle",
    # torchx-nightly is an optional dependency; see the `torchx` extra below.
    "lark",
    "tabulate",
    "opentelemetry-api",
    "clusterscope",
    "flask>=2.0",
    "py-spy",
    "xxhash",
]

# PyTorch nightly build indices for different platforms
# To use a different nightly, change the index in [tool.uv.sources] below
# or use: uv pip install --extra-index-url https://download.pytorch.org/whl/nightly/{platform} torch
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Override with: uv sync --extra-index-url https://download.pytorch.org/whl/nightly/{platform} e.g.
# uv sync --extra-index-url https://download.pytorch.org/whl/nightly/cu132
torch = [
    { index = "pytorch-cu132", marker = "sys_platform != 'darwin'"  },
    # MacOS cannot have cuda symbols, so default to CPU.
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

# Configure uv for torch nightly builds
[tool.uv]
prerelease = "allow"  # Required for torch nightly builds (pre-release versions)
required-environments = ["sys_platform == 'linux'"]  # Force resolution for Linux x86_64
python-preference = "managed"  # Use uv-managed Python installations
python-downloads = "automatic"  # Automatically download Python if needed
cache-keys = [
    { file = "pyproject.toml" },
    { file = "build_backend.py" },
    { file = "build_support.py" },
    # Note: we intentionally avoid "**/*.rs" because it matches generated
    # .rs files in target/release/build/, causing a full rebuild every time.
    { file = "*/src/**/*.rs" },
    { file = "*/Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "*/src/**/*.{cc,cpp,c,h}" },
    { file = "*/src/**/*.{cu,cuh}" },
    { file = "python/monarch/**/*.{cpp,c,h}" },
]

[project.optional-dependencies]
examples = [
    "bs4",
    "ipython",
    "psutil",
]
torchx = [
    # Optional dependency — only needed for TorchX-backed scheduling / job launching.
    "torchx-nightly",
]
test = [
    "kubernetes",
    "pytest",
    "pytest-timeout",
    "pytest-asyncio",
    "pytest-xdist",
    "pyright",
    "torchx-nightly",
]
kubernetes = [
    "kubernetes",
]

# Modern dependency groups for uv
[dependency-groups]
docs = [
    "sphinx>=6.2.1",
    "pytorch-sphinx-theme2",
    "sphinxcontrib.katex>=0.9.10",
    "docutils>=0.18.1,<0.21",
    "sphinx-design>=0.6.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "myst-parser",
    "sphinx-gallery>=0.14.0",
    "sphinx-sitemap>=2.7.1",
    "sphinxext-opengraph",
    "pillow",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.0",
    "pytest-split",
    "pyright>=1.1",
    "torch>=2.9.1",
    "torchx-nightly",
    "maturin>=1.14,<2",
    "packaging>=24",
]

[project.urls]
homepage = "https://meta-pytorch.org/monarch/"
documentation = "https://meta-pytorch.org/monarch/"
source = "https://github.com/meta-pytorch/monarch"
issues = "https://github.com/meta-pytorch/monarch/issues"
releasenotes = "https://github.com/meta-pytorch/monarch/releases"

[project.scripts]
monarch = "monarch.tools.cli:main"
monarch_bootstrap = "monarch._src.actor.bootstrap_main:invoke_main"
monarch-dashboard = "monarch.monarch_dashboard.__main__:main"

[tool.maturin]
manifest-path = "monarch_extension/Cargo.toml"
python-source = "python"
python-packages = ["monarch", "monarch_supervisor", "tests", "examples", "benches"]
module-name = "monarch._rust_bindings"
bindings = "pyo3"
locked = true
no-default-features = true
compatibility = "off"
use-base-python = true
exclude = [
    { path = "python/monarch/monarch_dashboard/frontend/**", format = "wheel" },
]
include = [
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "build_backend.py", format = "sdist" },
    { path = "build_support.py", format = "sdist" },
    { path = "monarch-tui", from = "out-dir", to = "torchmonarch-0.0.0.data/scripts" },
    { path = "rust-toolchain", format = "sdist" },
]

[tool.pytest.ini_options]
markers = [
    "oss_skip: marks tests to skip in OSS CI",
]
asyncio_mode = "auto"
# Default timeout of 5 minutes
timeout = 300

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# Formatting code
[tool.ruff]
target-version = "py310"

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
detect-same-package = false
order-by-type = false

[tool.ufmt]
formatter = "ruff-api"
sorter = "ruff-api"
